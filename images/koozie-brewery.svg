<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" role="img" aria-label="Brass-colored brewery koozie that says TAP ROOM">
  <defs>
    <linearGradient id="brew-can" x1="68" y1="40" x2="172" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="22%" stop-color="#dfe4e8"/>
      <stop offset="48%" stop-color="#f4f6f7"/>
      <stop offset="72%" stop-color="#c5ccd3"/>
      <stop offset="100%" stop-color="#7c868f"/>
    </linearGradient>
    <linearGradient id="brew-body" x1="42" y1="128" x2="198" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6b4c26"/>
      <stop offset="18%" stop-color="#8a6434"/>
      <stop offset="55%" stop-color="#b07f42"/>
      <stop offset="82%" stop-color="#8a6434"/>
      <stop offset="100%" stop-color="#6b4c26"/>
    </linearGradient>
    <radialGradient id="brew-open" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1915" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1c1915" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="brew-shade" x1="160" y1="140" x2="200" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6b4c26" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b4c26" stop-opacity="0.45"/>
    </linearGradient>
    
        <pattern id="brew-foam" width="6" height="6" patternUnits="userSpaceOnUse">
          <circle cx="1.2" cy="1.2" r="0.7" fill="#1c1915" fill-opacity="0.10"/>
          <circle cx="4.2" cy="4.4" r="0.55" fill="#1c1915" fill-opacity="0.08"/>
        </pattern>
    <filter id="brew-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1c1915" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="120" cy="314" rx="74" ry="12" fill="#1c1915" opacity="0.16"/>

  <!-- can (behind koozie lip) -->
  <g>
    <path d="M68 52 L68 136 L172 136 L172 52" fill="url(#brew-can)"/>
    <ellipse cx="120" cy="136" rx="52" ry="16" fill="#9aa3ad"/>
    <ellipse cx="120" cy="52" rx="52" ry="17" fill="url(#brew-can)"/>
    <ellipse cx="120" cy="48" rx="46" ry="13" fill="#b8c0c7"/>
    <ellipse cx="120" cy="46" rx="40" ry="10" fill="#6f7880"/>
    <ellipse cx="120" cy="44" rx="36" ry="8" fill="#cfd5da"/>
    <!-- can highlight -->
    <path d="M80 62 C84 62, 86 90, 86 110 C86 124, 82 132, 78 132" fill="#ffffff" opacity="0.28"/>
    <!-- pull tab hint -->
    <rect x="112" y="36" width="16" height="8" rx="3" fill="#d7dce0" stroke="#5c656c" stroke-width="1"/>
  </g>

  <!-- koozie body -->
  <g filter="url(#brew-soft)">
    <path d="M42 128 L50 290 A70 20 0 0 0 190 290 L198 128" fill="url(#brew-body)"/>
    <path d="M42 128 L50 290 A70 20 0 0 0 190 290 L198 128" fill="url(#brew-foam)" opacity="0.85"/>
    
    <!-- right wrap shade -->
    <path d="M168 132 L182 290 A70 20 0 0 0 190 290 L198 128 Z" fill="url(#brew-shade)"/>
    <!-- bottom ellipse -->
    <ellipse cx="120" cy="290" rx="70" ry="20" fill="#6b4c26"/>
    <ellipse cx="120" cy="288" rx="66" ry="16" fill="#8a6434" opacity="0.7"/>
    
  </g>

  <!-- top opening: inside then rim -->
  <ellipse cx="120" cy="128" rx="78" ry="24" fill="#5c401f"/>
  <ellipse cx="120" cy="130" rx="62" ry="18" fill="url(#brew-open)"/>
  <!-- can showing through the opening -->
  <ellipse cx="120" cy="128" rx="52" ry="15" fill="#8b949e"/>
  <ellipse cx="120" cy="126" rx="50" ry="13" fill="url(#brew-can)"/>
  <!-- front lip highlight -->
  <path d="M46 128 A74 24 0 0 0 194 128" fill="none" stroke="#b07f42" stroke-width="3" opacity="0.55"/>
  <path d="M54 136 A66 16 0 0 0 186 136" fill="none" stroke="#1c1915" stroke-width="2" opacity="0.2"/>

  <!-- printed design -->
  <g>
        <rect x="78" y="176" width="84" height="64" rx="8" fill="#ffcc33" fill-opacity="0.15" stroke="#ffcc33" stroke-width="2"/>
        <text x="120" y="204" text-anchor="middle" font-family="Lilita One, Fredoka, sans-serif" font-size="20" fill="#ffcc33">TAP</text>
        <text x="120" y="226" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="11" font-weight="600" fill="#ffcc33" letter-spacing="1.5">ROOM</text>
        </g>
</svg>
